<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #f1f2f5; padding: 20px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .label { font-size: 10px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
  .badge { display: inline-flex; align-items: center; border-radius: 9999px; font-size: 12px; font-weight: 600; padding: 2px 10px; }
  .stage-chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 9999px; font-size: 12px; font-weight: 600; padding: 3px 12px; color: white; }
  .stock-chip { display: inline-flex; align-items: center; border-radius: 4px; font-size: 11px; font-weight: 600; padding: 1px 6px; }
</style>
</head>
<body>
  <div class="label">Order Stage Badges</div>
  <div class="row">
    <span class="stage-chip" style="background:#94a3b8;">Draft</span>
    <span class="stage-chip" style="background:#3b82f6;">Confirmed</span>
    <span class="stage-chip" style="background:#f59e0b;">Packed</span>
    <span class="stage-chip" style="background:#10b981;">Delivered</span>
    <span class="stage-chip" style="background:#8b5cf6;">Paid</span>
  </div>
  <div class="label">Stock Status</div>
  <div class="row">
    <span class="stock-chip" style="background:hsl(142 71% 45% / 0.10);color:hsl(142 71% 32%);">In stock: 48 Pcs</span>
    <span class="stock-chip" style="background:hsl(38 92% 50% / 0.10);color:hsl(38 92% 36%);">Low stock: 3 Pcs</span>
    <span class="stock-chip" style="background:hsl(0 84% 60% / 0.10);color:hsl(0 84% 44%);">Out of stock: 0 Pcs</span>
  </div>
  <div class="label">Trend Badges</div>
  <div class="row">
    <span class="stock-chip" style="background:hsl(142 71% 45% / 0.10);color:hsl(142 71% 32%);">+12.4%</span>
    <span class="stock-chip" style="background:hsl(0 84% 60% / 0.10);color:hsl(0 84% 44%);">−3.2%</span>
  </div>
</body></html>
