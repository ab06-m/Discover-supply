<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #f1f2f5; padding: 20px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .label { font-size: 10px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
  button { font-family: 'DM Sans', sans-serif; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; border-radius: 8px; font-size: 14px; font-weight: 500; transition: all 150ms; }
  .btn-default { background: hsl(221 83% 53%); color: white; border: none; height: 40px; padding: 0 16px; }
  .btn-default:hover { background: hsl(221 83% 47%); }
  .btn-outline { background: white; color: #0f172a; border: 1px solid #e2e6ec; height: 40px; padding: 0 16px; }
  .btn-outline:hover { background: hsl(217 91% 96%); }
  .btn-ghost { background: transparent; color: #0f172a; border: none; height: 40px; padding: 0 16px; }
  .btn-ghost:hover { background: hsl(217 91% 96%); color: hsl(221 83% 33%); }
  .btn-destructive { background: hsl(0 84% 60%); color: white; border: none; height: 40px; padding: 0 16px; }
  .btn-destructive:hover { background: hsl(0 84% 54%); }
  .btn-sm { height: 36px; padding: 0 12px; font-size: 13px; }
  .btn-lg { height: 44px; padding: 0 24px; font-size: 15px; }
  .btn-icon { height: 40px; width: 40px; padding: 0; justify-content: center; }
  .btn-disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
  svg { width: 14px; height: 14px; flex-shrink: 0; }
</style>
</head>
<body>
  <div class="label">Variants</div>
  <div class="row">
    <button class="btn-default">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New order
    </button>
    <button class="btn-outline">Filter</button>
    <button class="btn-ghost">Cancel</button>
    <button class="btn-destructive">Delete</button>
    <button class="btn-default btn-disabled">Saving…</button>
  </div>
  <div class="label">Sizes</div>
  <div class="row">
    <button class="btn-default btn-sm">Small</button>
    <button class="btn-default">Default</button>
    <button class="btn-default btn-lg">Large</button>
    <button class="btn-outline btn-icon">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
  </div>
</body></html>
