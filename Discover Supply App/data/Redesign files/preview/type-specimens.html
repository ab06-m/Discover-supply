<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: white; padding: 20px 24px; border: 1px solid #e2e6ec; border-radius: 10px; }
  .section { margin-bottom: 14px; }
  .tag { font-size: 10px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
</style>
</head>
<body>
  <div class="section">
    <div class="tag">Page Title</div>
    <div style="font-size:20px;font-weight:600;color:#0f172a;line-height:1.25;">Dashboard</div>
    <div style="font-size:14px;color:#6b7280;margin-top:2px;">Welcome to Acme Distributors.</div>
  </div>
  <div class="section">
    <div class="tag">Card Title + Body</div>
    <div style="font-size:16px;font-weight:600;color:#0f172a;line-height:1.25;margin-bottom:6px;">Order detail</div>
    <div style="font-size:14px;color:#0f172a;line-height:1.5;">Walk-in customer · Main stock · USD - Retail price</div>
    <div style="font-size:12px;color:#6b7280;margin-top:2px;">Internal notes not shown to customer</div>
  </div>
  <div class="section">
    <div class="tag">Stat Value</div>
    <div style="font-size:12px;font-weight:500;color:#6b7280;margin-bottom:2px;">Revenue (shipped)</div>
    <div style="font-size:24px;font-weight:700;color:#0f172a;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;">$48,320</div>
    <div style="display:inline-flex;align-items:center;gap:4px;margin-top:4px;">
      <span style="background:hsl(142 71% 45% / 0.10);color:hsl(142 71% 35%);font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;">+12.4%</span>
      <span style="font-size:11px;color:#6b7280;">vs last month</span>
    </div>
  </div>
  <div class="section" style="margin-bottom:0">
    <div class="tag">Table Header</div>
    <div style="font-size:12px;font-weight:500;color:#6b7280;text-transform:uppercase;letter-spacing:0.06em;">Order · Store · Stage · Date · Total</div>
  </div>
</body></html>
