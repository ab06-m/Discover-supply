<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #f1f2f5; padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { background: white; border: 1px solid #e2e6ec; border-radius: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.04),0 1px 3px rgba(0,0,0,0.06); padding: 18px; }
  .row { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; }
  .stat-label { font-size: 13px; font-weight: 500; color: #6b7280; }
  .icon-box { width: 32px; height: 32px; border-radius: 8px; background: hsl(221 83% 53% / 0.10); display: flex; align-items: center; justify-content: center; }
  svg { width: 15px; height: 15px; }
  .stat-val { font-size: 22px; font-weight: 700; color: #0f172a; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .badge { display: inline-flex; align-items: center; border-radius: 4px; font-size: 11px; font-weight: 600; padding: 1px 6px; margin-right: 4px; }
  .hint { font-size: 11px; color: #6b7280; margin-top: 5px; }
</style>
</head>
<body>
<div class="grid">
  <div class="stat">
    <div class="row"><span class="stat-label">Products</span><div class="icon-box"><svg fill="none" stroke="hsl(221 83% 53%)" stroke-width="2" viewBox="0 0 24 24"><path d="M20 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg></div></div>
    <div class="stat-val">342</div>
    <div class="hint">Active SKUs</div>
  </div>
  <div class="stat">
    <div class="row"><span class="stat-label">Low-stock alerts</span><div class="icon-box" style="background:hsl(38 92% 50% / 0.10);"><svg fill="none" stroke="hsl(38 92% 50%)" stroke-width="2" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div></div>
    <div class="stat-val">7</div>
    <div class="hint" style="display:flex;align-items:center;gap:4px;"><span class="badge" style="background:hsl(0 84% 60% / 0.10);color:hsl(0 84% 40%);">+3</span>since yesterday</div>
  </div>
  <div class="stat">
    <div class="row"><span class="stat-label">Revenue (shipped)</span><div class="icon-box" style="background:hsl(142 71% 45% / 0.10);"><svg fill="none" stroke="hsl(142 71% 38%)" stroke-width="2" viewBox="0 0 24 24"><path d="M20 12V22H4V12"/><path d="M22 7H2v5h20V7z"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg></div></div>
    <div class="stat-val">$48,320</div>
    <div class="hint" style="display:flex;align-items:center;gap:4px;"><span class="badge" style="background:hsl(142 71% 45% / 0.10);color:hsl(142 71% 32%);">+12.4%</span>vs last month</div>
  </div>
</div>
</body></html>
