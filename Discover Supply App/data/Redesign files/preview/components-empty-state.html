<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #f1f2f5; padding: 20px; display: flex; gap: 16px; }
  .empty { background: white; border: 1px solid #e2e6ec; border-radius: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); padding: 40px 32px; text-align: center; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .icon-ring { width: 48px; height: 48px; border-radius: 12px; background: hsl(221 83% 53% / 0.08); display: flex; align-items: center; justify-content: center; margin-bottom: 4px; }
  svg { width: 22px; height: 22px; }
  .title { font-size: 15px; font-weight: 600; color: #0f172a; }
  .desc { font-size: 13px; color: #6b7280; max-width: 240px; line-height: 1.5; }
  .btn { background: hsl(221 83% 53%); color: white; border: none; border-radius: 8px; padding: 8px 16px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; margin-top: 4px; }
  .empty-dashed { background: hsl(220 14% 96% / 0.6); border: 1.5px dashed #c8cdd6; border-radius: 10px; padding: 28px; text-align: center; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #6b7280; font-size: 13px; }
</style>
</head>
<body>
  <div class="empty">
    <div class="icon-ring">
      <svg fill="none" stroke="hsl(221 83% 53%)" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
    </div>
    <div class="title">No orders yet</div>
    <div class="desc">Create an order to reserve inventory, produce paperwork, and coordinate delivery.</div>
    <button class="btn">Create your first order</button>
  </div>
  <div class="empty-dashed">
    <svg fill="none" stroke="#94a3b8" stroke-width="1.8" viewBox="0 0 24 24" style="width:28px;height:28px;margin-bottom:4px;"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    No items yet. Search a product, scan a barcode, or add a custom line.
  </div>
</body></html>
