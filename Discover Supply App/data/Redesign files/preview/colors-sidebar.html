<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #f1f2f5; padding: 32px; }
  .sidebar { background: hsl(221 83% 53%); border-radius: 12px; padding: 12px 8px; width: 80px; display: inline-flex; flex-direction: column; gap: 2px; align-items: center; }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 8px; border-radius: 8px; cursor: pointer; width: 100%; }
  .nav-item.active { background: white; }
  .nav-item.active .nav-icon { color: hsl(221 83% 53%); }
  .nav-item.active .nav-label { color: hsl(221 83% 53%); }
  .nav-item:hover:not(.active) { background: rgba(255,255,255,0.12); }
  .nav-icon { width: 20px; height: 20px; color: rgba(255,255,255,0.85); flex-shrink: 0; }
  .nav-label { font-size: 10px; font-weight: 500; color: rgba(255,255,255,0.85); text-align: center; line-height: 1; }
  .nav-item.muted .nav-icon { color: hsl(215 90% 78%); }
  .nav-item.muted .nav-label { color: hsl(215 90% 78%); }

  .annotations { display: inline-flex; flex-direction: column; gap: 8px; vertical-align: top; margin-left: 24px; margin-top: 4px; }
  .ann { font-size: 11px; color: #6b7280; display: flex; align-items: center; gap: 8px; font-family: 'DM Sans', sans-serif; }
  .dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
  .ann-label { font-weight: 500; color: #374151; }
  .ann-val { color: #9ca3af; font-size: 10px; margin-left: 2px; }
</style>
</head>
<body>
<div style="display:flex; gap:0; align-items:flex-start;">
  <div class="sidebar">
    <div class="nav-item active">
      <svg class="nav-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span class="nav-label">Dashboard</span>
    </div>
    <div class="nav-item">
      <svg class="nav-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
      <span class="nav-label">Products</span>
    </div>
    <div class="nav-item">
      <svg class="nav-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span class="nav-label">Clients</span>
    </div>
    <div class="nav-item">
      <svg class="nav-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13" rx="1"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
      <span class="nav-label">Shipment</span>
    </div>
    <div class="nav-item muted">
      <svg class="nav-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      <span class="nav-label">Purchase</span>
    </div>
  </div>

  <div class="annotations">
    <div class="ann">
      <div class="dot" style="background:white; border:1px solid #e2e6ec;"></div>
      <span><span class="ann-label">Active</span> — white bg, primary icon &amp; label<span class="ann-val">hsl(221 83% 53%)</span></span>
    </div>
    <div class="ann">
      <div class="dot" style="background:rgba(255,255,255,0.85);"></div>
      <span><span class="ann-label">Default</span> — white/85 icon &amp; label</span>
    </div>
    <div class="ann">
      <div class="dot" style="background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25);"></div>
      <span><span class="ann-label">Hover</span> — white/12 background</span>
    </div>
    <div class="ann">
      <div class="dot" style="background:hsl(215 90% 78%);"></div>
      <span><span class="ann-label">Muted</span> — subdued item<span class="ann-val">hsl(215 90% 78%)</span></span>
    </div>
    <div class="ann">
      <div class="dot" style="background:hsl(221 83% 53%);"></div>
      <span><span class="ann-label">Sidebar bg</span> — Primary blue<span class="ann-val">hsl(221 83% 53%)</span></span>
    </div>
  </div>
</div>
</body></html>
