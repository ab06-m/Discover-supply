<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #f1f2f5; padding: 20px; }
  .row { display: flex; gap: 8px; }
  .swatch { flex: 1; border-radius: 8px; overflow: hidden; border: 1px solid rgba(0,0,0,0.06); }
  .swatch-color { height: 64px; }
  .swatch-info { background: white; padding: 8px 10px; }
  .swatch-name { font-size: 11px; font-weight: 600; color: #0f172a; }
  .swatch-val { font-size: 10px; color: #6b7280; font-variant-numeric: tabular-nums; margin-top: 1px; }
</style>
</head>
<body>
<div class="row">
  <div class="swatch">
    <div class="swatch-color" style="background:hsl(221 83% 53%)"></div>
    <div class="swatch-info"><div class="swatch-name">Primary</div><div class="swatch-val">221 83% 53%</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:hsl(221 83% 45%)"></div>
    <div class="swatch-info"><div class="swatch-name">Primary Dark</div><div class="swatch-val">221 83% 45%</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:hsl(217 91% 96%)"></div>
    <div class="swatch-info"><div class="swatch-name">Primary Light</div><div class="swatch-val">217 91% 96%</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:hsl(215 90% 75%)"></div>
    <div class="swatch-info"><div class="swatch-name">Primary Muted</div><div class="swatch-val">215 90% 75%</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:hsl(220 14% 96%)"></div>
    <div class="swatch-info"><div class="swatch-name">Background</div><div class="swatch-val">220 14% 96%</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:white; border-bottom:1px solid #e2e6ec"></div>
    <div class="swatch-info"><div class="swatch-name">Card</div><div class="swatch-val">#ffffff</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:hsl(220 13% 91%)"></div>
    <div class="swatch-info"><div class="swatch-name">Border</div><div class="swatch-val">220 13% 91%</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:hsl(222 47% 11%)"></div>
    <div class="swatch-info"><div class="swatch-name">Foreground</div><div class="swatch-val">222 47% 11%</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:hsl(220 9% 46%)"></div>
    <div class="swatch-info"><div class="swatch-name">Muted FG</div><div class="swatch-val">220 9% 46%</div></div>
  </div>
</div>
</body></html>
