<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #f1f2f5; padding: 20px; }
  .row { display: flex; gap: 8px; }
  .group { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .swatch { border-radius: 8px; overflow: hidden; border: 1px solid rgba(0,0,0,0.06); }
  .swatch-color { height: 50px; }
  .swatch-bg { height: 28px; }
  .swatch-info { background: white; padding: 8px 10px; }
  .swatch-name { font-size: 11px; font-weight: 600; color: #0f172a; }
  .swatch-val { font-size: 10px; color: #6b7280; margin-top: 1px; }
  .label { font-size: 10px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 2px; }
</style>
</head>
<body>
<div class="row">
  <div class="group">
    <div class="label">Success</div>
    <div class="swatch"><div class="swatch-color" style="background:hsl(142 71% 45%)"></div><div class="swatch-info"><div class="swatch-name">Success</div><div class="swatch-val">142 71% 45%</div></div></div>
    <div class="swatch"><div class="swatch-bg" style="background:hsl(142 71% 45% / 0.10)"></div><div class="swatch-info"><div class="swatch-name">Success BG</div><div class="swatch-val">10% opacity</div></div></div>
  </div>
  <div class="group">
    <div class="label">Warning</div>
    <div class="swatch"><div class="swatch-color" style="background:hsl(38 92% 50%)"></div><div class="swatch-info"><div class="swatch-name">Warning</div><div class="swatch-val">38 92% 50%</div></div></div>
    <div class="swatch"><div class="swatch-bg" style="background:hsl(38 92% 50% / 0.10)"></div><div class="swatch-info"><div class="swatch-name">Warning BG</div><div class="swatch-val">10% opacity</div></div></div>
  </div>
  <div class="group">
    <div class="label">Destructive</div>
    <div class="swatch"><div class="swatch-color" style="background:hsl(0 84% 60%)"></div><div class="swatch-info"><div class="swatch-name">Destructive</div><div class="swatch-val">0 84% 60%</div></div></div>
    <div class="swatch"><div class="swatch-bg" style="background:hsl(0 84% 60% / 0.10)"></div><div class="swatch-info"><div class="swatch-name">Destructive BG</div><div class="swatch-val">10% opacity</div></div></div>
  </div>
</div>
</body></html>
