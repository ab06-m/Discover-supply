<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #f1f2f5; padding: 20px; }
  .card { background: white; border: 1px solid #e2e6ec; border-radius: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.04),0 1px 3px rgba(0,0,0,0.06); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th { font-size: 12px; font-weight: 500; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; padding: 10px 16px; text-align: left; background: #f8f9fb; border-bottom: 1px solid #e2e6ec; }
  th.right { text-align: right; }
  td { font-size: 14px; color: #0f172a; padding: 11px 16px; border-bottom: 1px solid #f1f2f5; }
  td.muted { color: #6b7280; }
  td.right { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: hsl(217 91% 96%); }
  .order-link { color: #0f172a; font-weight: 600; text-decoration: none; }
  .order-link:hover { text-decoration: underline; color: hsl(221 83% 53%); }
  .stage-chip { display: inline-flex; border-radius: 9999px; font-size: 11px; font-weight: 600; padding: 2px 10px; color: white; }
</style>
</head>
<body>
<div class="card">
  <table>
    <thead>
      <tr>
        <th>Order</th><th>Store</th><th>Stage</th><th>Date</th><th class="right">Total</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td><a class="order-link" href="#">ORD-0042</a></td>
        <td><div>Metro Mart</div><div style="font-size:11px;color:#6b7280;">MM-01</div></td>
        <td><span class="stage-chip" style="background:#3b82f6;">Confirmed</span></td>
        <td class="muted">Apr 28, 2026</td>
        <td class="right">$1,240.00</td>
      </tr>
      <tr>
        <td><a class="order-link" href="#">ORD-0041</a></td>
        <td><div>Corner Store</div></td>
        <td><span class="stage-chip" style="background:#f59e0b;">Packed</span></td>
        <td class="muted">Apr 27, 2026</td>
        <td class="right">$385.50</td>
      </tr>
      <tr>
        <td><a class="order-link" href="#">ORD-0040</a></td>
        <td class="muted">—</td>
        <td><span class="stage-chip" style="background:#94a3b8;">Draft</span></td>
        <td class="muted">Apr 27, 2026</td>
        <td class="right">$72.00</td>
      </tr>
      <tr>
        <td><a class="order-link" href="#">ORD-0039</a></td>
        <td><div>Sunrise Deli</div><div style="font-size:11px;color:#6b7280;">SD-04</div></td>
        <td><span class="stage-chip" style="background:#10b981;">Delivered</span></td>
        <td class="muted">Apr 26, 2026</td>
        <td class="right">$2,108.75</td>
      </tr>
    </tbody>
  </table>
</div>
</body></html>
